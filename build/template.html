<style>
:root{color-scheme:light;--bg:#f6f5f2;--card:#fff;--line:#e2e0d8;--text:#111;--text2:#55534e;--muted:#85837b;--accent:#d9480f;--chip:#efede7;--pb-silver:#9aa1ab;--pb-gold:#c99a1e;--pb-diamond:#5bb8e6;--pb-ruby:#c0213f;--pb-red:#e4253b;--s1:#2a78d6;--s2:#1baf7a;--s1-ink:#164f99;--s2-ink:#0b6e4b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111110;--card:#1b1b1a;--line:#2f2e2b;--text:#f1f0ec;--text2:#c4c2b9;--muted:#8d8b83;--accent:#ff7a3d;--chip:#262624;--s1:#3987e5;--s2:#199e70;--s1-ink:#9cc3f5;--s2-ink:#7fd9b5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--card:#1b1b1a;--line:#2f2e2b;--text:#f1f0ec;--text2:#c4c2b9;--muted:#8d8b83;--accent:#ff7a3d;--chip:#262624;--s1:#3987e5;--s2:#199e70;--s1-ink:#9cc3f5;--s2-ink:#7fd9b5}
*{box-sizing:border-box}
:root{--wmax:1120px}
body.makers-page{--wmax:2240px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:var(--wmax);margin:0 auto;padding:0 16px}
button,select,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
header{padding-top:40px;padding-bottom:18px}
header h1 a{text-decoration:none}
header.wrap{padding-top:22px}
body.makers-page header.wrap{padding-top:36px}
.brandrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand svg{width:72px;height:72px;flex:none;margin:-8px -10px -6px -12px}
.brand b{display:block;font-size:44px;line-height:1;font-weight:800;letter-spacing:-.035em}
.brand small{display:block;margin-top:6px;font-size:15px;color:var(--text2)}
.brandrow .facts{margin:0 0 4px}
.crumb .mini svg{width:18px;height:18px;vertical-align:-4px;margin-right:7px}
body{overflow-x:clip}
.brand b em{font-style:normal;color:#e62e25}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand b em{color:#ff4a3d}}
:root[data-theme="dark"] .brand b em{color:#ff4a3d}
.carousel{position:relative;margin:12px calc(50% - 50vw) 0;width:100vw;overflow:hidden;padding:4px 0 8px;outline:none}
.ctrack{display:flex;gap:16px;will-change:transform;transition:transform .9s cubic-bezier(.65,0,.35,1),opacity .35s ease}
.ctrack.jump{transition:none}
.ctrack.fade{opacity:0}
.slide{position:relative;flex:none;width:var(--sw);aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--chip);text-decoration:none;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12);transform:scale(.94);opacity:.55;transition:transform .9s cubic-bezier(.65,0,.35,1),opacity .9s ease}
.slide.on{transform:none;opacity:1}
.slide img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 6s ease-out}
.slide.on img.th{transform:scale(1.12)}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.carousel.small .slide .cap b{font-size:16px}
.carousel.small .cnav{width:38px;height:38px;font-size:19px;top:calc(50% - 19px)}
.slide .cap b{display:block;font-size:20px;line-height:1.2;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.slide .cap span{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:13px;color:rgba(255,255,255,.85)}
.slide .cap span img{width:22px;height:22px;border-radius:50%;background:#444}
.cnav{position:absolute;top:calc(50% - 24px);width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:22px;line-height:1;cursor:pointer;opacity:.92}
.cnav:hover{opacity:1}
.cnav.prev{left:max(12px,calc(50vw - var(--wmax) / 2 - 22px))}
.cnav.next{right:max(12px,calc(50vw - var(--wmax) / 2 - 22px))}
.crow{margin-top:40px}
.junk{margin-top:64px;padding-top:28px;border-top:1px solid var(--line);transition:opacity .3s}
.junk.fade{opacity:0}
:root{--m0:#e9e7e1;--m1:#cfe0f6;--m2:#93bcec;--m3:#4c8edf;--m4:#1d5fb8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m0:#2a2a28;--m1:#1f3654;--m2:#2a5a95;--m3:#3d84dc;--m4:#9cc3f5}}
:root[data-theme="dark"]{--m0:#2a2a28;--m1:#1f3654;--m2:#2a5a95;--m3:#3d84dc;--m4:#9cc3f5}
.cmap{margin:-24px 0 48px;padding:22px 26px!important}
.mapwrap{position:relative;margin-top:12px}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap path,.mapwrap circle{stroke:var(--card);stroke-width:.6;transition:fill .2s}
.mapwrap .l0{fill:var(--m0)}.mapwrap .l1{fill:var(--m1)}.mapwrap .l2{fill:var(--m2)}.mapwrap .l3{fill:var(--m3)}.mapwrap .l4{fill:var(--m4)}
.mapwrap .l1:hover,.mapwrap .l2:hover,.mapwrap .l3:hover,.mapwrap .l4:hover{filter:brightness(1.12)}
.mapwrap .sel{stroke:var(--accent);stroke-width:2.2;paint-order:stroke}
.mapwrap circle{stroke-width:1.5}
.ficon.globe{fill:none;stroke:var(--accent);stroke-width:1.8}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.cchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text)}
.cchip span{color:var(--muted);margin-left:3px}
.cchip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.cchip[aria-pressed="true"] span{color:inherit;opacity:.7}
.cchip.none{border-style:dashed}
.cchip.clear{border-color:var(--accent);color:var(--accent)}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:40;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:10px 16px 10px 13px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:tin .25s ease}
.totop[hidden]{display:none}
.totop:hover{border-color:var(--accent)}
.totop svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.jumpbar{margin-top:28px;display:flex;justify-content:center}
.jumpjunk{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.jumpjunk:hover{border-color:var(--accent)}
.jumpjunk svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}
.jumpjunk span{color:var(--muted);transition:transform .2s}
.jumpjunk:hover span{transform:translateY(2px)}
.junk.opened .jrow{animation:jopen .7s cubic-bezier(.2,.8,.3,1) both}
.junk.opened .jrow:nth-of-type(3){animation-delay:.06s}.junk.opened .jrow:nth-of-type(4){animation-delay:.12s}.junk.opened .jrow:nth-of-type(5){animation-delay:.18s}
@keyframes jopen{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.jrow{margin:12px calc(50% - 50vw) 0;width:100vw;overflow:hidden}
.jtrack{display:flex;width:max-content;will-change:transform}
.jrow{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.jrow.dragging{cursor:grabbing}
.jset{display:flex;gap:12px;padding-right:12px}
.slide.jt{border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.slide.jt img.th{transform:none;transition:transform .4s ease}
.slide.jt:hover img.th{transform:scale(1.06)}
.slide.jt .cap{padding:26px 10px 8px}
.slide.jt .cap b{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide.jt .cap span{font-size:11.5px;margin-top:2px}

.browse{margin-top:72px;padding-top:28px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.browse h2{margin:0;font-size:22px;letter-spacing:-.015em}
.browse span{font-size:13px;color:var(--muted)}
body.makers-page header.wrap{padding-bottom:4px}
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rhead h2{margin:0;font-size:22px;letter-spacing:-.015em}
.rhead span{font-size:13px;color:var(--muted)}
.rhead .rshuf{margin-left:auto}
.rshuf{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13px;color:var(--text2)}
.rshuf:hover{color:var(--text)}
@media (max-width:600px){.rhead span,.browse span{order:3;width:100%;margin-top:-6px}.rhead h2,.browse h2{font-size:20px}.crow{margin-top:32px}.browse{margin-top:48px}.brand b{font-size:26px}.brand small{font-size:14px}.brand svg{width:58px;height:58px}.cnav{display:none}.slide .cap b{font-size:17px}}
@media (prefers-reduced-motion:reduce){.ctrack,.slide,.slide img.th{transition-duration:.01s!important}}
.crumb{display:inline-block;font-size:14px;color:var(--text2);text-decoration:none;margin-bottom:10px}
.crumb:hover{color:var(--text)}
.who{display:flex;gap:16px;align-items:center}
.who h1{margin:0 0 4px}
.who .lead{margin:0}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--chip);flex:none}
body.makers-page #path{display:none}
.sizef{margin-top:12px;margin-bottom:48px;padding:22px 26px!important}
.fh{display:flex;align-items:center;gap:8px}
.ficon{width:18px;height:18px;fill:var(--accent);flex:none}
.fhint{margin:3px 0 0;font-size:13px;color:var(--muted)}
.sizef .ph{align-items:flex-start}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.presets button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text);display:inline-flex;gap:6px;align-items:baseline}
.presets button span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.presets button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.presets button[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.scale{position:relative;margin:8px 12px 0;touch-action:none;user-select:none}
.scale .track{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--line)}
.scale .sel{position:absolute;height:6px;border-radius:3px;background:var(--accent)}
.scale .hdl{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--card);border:3px solid var(--accent);cursor:grab;padding:0;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.scale .hdl.drag{cursor:grabbing;transform:scale(1.15)}
.scale .hdl:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.scale .sdot{position:absolute;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--s1);border:2px solid var(--card);z-index:2;transition:opacity .15s}
.scale .sdot:hover{transform:scale(1.4)}
.scale .sdot.out{opacity:.22}
.scale .ms{position:absolute;top:0;border-left:1.5px dashed var(--line);z-index:1}
.scale .pb{position:absolute;top:0;left:-10px;width:20px;height:14px;border-radius:4px;background:var(--c)}
.scale .pb::after{content:"";position:absolute;left:8px;top:3.5px;border-left:6px solid #fff;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.scale .ml{position:absolute;top:0;left:13px;font-size:11px;color:var(--text2);white-space:nowrap;line-height:14px}
.scale .ms.flip .ml{left:auto;right:-10px;top:15px}
.scale .tick{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.scale .ml{display:none}.scale{margin:8px 8px 0}}
.mline{font-size:13px;color:var(--text2);margin-top:-4px}
.mline b{color:var(--text);font-weight:600}
.mline .hl{color:var(--accent);font-weight:600}
.makers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:28px;padding-top:6px;padding-bottom:64px}
.maker{display:flex;flex-direction:column;gap:18px;padding:22px 24px!important}
.mhead{display:flex;gap:14px;align-items:center;text-decoration:none;position:relative}
.mnum{position:absolute;left:-6px;top:-6px;z-index:1;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--text);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.mhead h2{font-size:22px;margin:0}
.mhead p{margin:2px 0 0;color:var(--text2);font-size:14.5px}
.mhead:hover h2{text-decoration:underline}
.mstats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mstats div{background:var(--bg);border-radius:10px;padding:8px 10px}
.mstats b{display:flex;align-items:center;gap:5px;font-size:18px;font-variant-numeric:tabular-nums}
.mstats span{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s1);display:inline-block}
.dot.short{border-radius:2px;background:var(--s2)}
.mtop h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:0 0 8px}
.mtop a{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;text-decoration:none;padding:4px;border-radius:8px}
.mtop a:hover{background:var(--chip)}
.mtop img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--chip)}
.mtop b{display:block;font-size:14.5px;line-height:1.3}
.mtop span span{font-size:12.5px;color:var(--muted)}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
.prog .bar{width:110px;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.go{font-weight:600;font-size:14.5px;text-decoration:none;background:var(--text);color:var(--bg);border-radius:10px;padding:8px 14px}
.go:hover{opacity:.9}
@media (max-width:560px){.mstats{grid-template-columns:repeat(3,1fr)}.avatar{width:56px;height:56px}}
body.proj header{padding-top:16px;padding-bottom:6px}
body.proj header h1{font-size:28px;margin:2px 0 4px}
body.proj header .lead{display:none}
body.proj header .facts{margin-top:4px}
.path{padding-bottom:10px}
.path[hidden]{display:none}
.phead{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text2);margin-bottom:8px}
.phead b{color:var(--text)}
.phead .grow{flex:1;min-width:0}
.arrow{flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:30px;cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.arrow:hover:not(:disabled){border-color:var(--text2)}
.arrow:disabled{opacity:.35;cursor:default}
.gridlink{font-size:13px;color:var(--text2);white-space:nowrap}
.path{position:relative}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg-cur{background:var(--accent)}
.lg-seen{background:var(--text2)}
.pchart{position:relative}
.pchart svg{display:block;width:100%;overflow:visible}
.pchart .ax text{fill:var(--muted);font-size:10px}
.pchart .gl{stroke:var(--line);stroke-width:1}
.pchart .pl{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-opacity:.45;stroke-linejoin:round}
.pchart .nd{fill:var(--card);stroke:var(--text2);stroke-width:1.5}
.pchart .nd.seen{fill:var(--text2)}
.pchart .nd.long{fill:var(--s1);stroke:var(--card);stroke-width:1.5}
.pchart .nd.short{fill:var(--s2);stroke:var(--card);stroke-width:1.5}
.pchart .pl-long{stroke:var(--s1);stroke-opacity:.55;stroke-width:2}

.pchart .nd.cur-ring{stroke:var(--accent);stroke-width:3}
.lg-ring{border:2.5px solid var(--accent);background:var(--card)}
.pchart .nd.out{opacity:.2}
.pchart .cur{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.pchart .cur-halo{fill:var(--accent);opacity:.18}
.pchart .hl{fill:none;stroke:var(--text);stroke-width:1.5}
.ptip{position:absolute;pointer-events:none;display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:260px;z-index:30;color:var(--text2)}
.ptip b{display:block;color:var(--text);font-size:13px;line-height:1.3}
.ptip img{display:block;width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;margin-bottom:6px;background:var(--chip)}
.ptip .mut{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph h3,.ph h4{margin:0}
.ph h3{font-size:18px}
.sub{color:var(--text2);font-size:14px;margin:4px 0 10px}
.sub.small{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 14px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.stat .v{font-size:22px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v.sm{font-size:15px;font-weight:600;line-height:1.35;margin-top:2px}
.stat .h{font-size:12px;color:var(--muted)}
.trend{display:flex;gap:7px;align-items:baseline;font-size:14px!important;font-weight:500!important}

<script>
const DATA = /*DATA*/null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const CREATORS = DATA.creators;
CREATORS.forEach(c => {
  const I = c.inventions;

});
const SITE = "YouTuber Invention Catalogue";
const LOGO = `<svg viewBox="-2 -4 44 46" aria-hidden="true"><g stroke="#e62e25" stroke-width="2.6" stroke-linecap="round"><path d="M20-2.5v3.2M6.3 3.2l2.3 2.3M33.7 3.2l-2.3 2.3M1.5 15.5h3.2M38.5 15.5h-3.2"/></g><path d="M20 4C13 4 8 9.3 8 15.8c0 4 2 7.1 4.8 9.3 1.1.9 1.7 2 1.7 3.3v.9h11v-.9c0-1.3.6-2.4 1.7-3.3 2.8-2.2 4.8-5.3 4.8-9.3C32 9.3 27 4 20 4z" fill="#e62e25"/><path d="M17 10.6l8.6 5.2-8.6 5.2z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><rect x="14.5" y="31" width="11" height="3" rx="1.5" fill="#8a8780"/><rect x="16" y="35.6" width="8" height="2.8" rx="1.4" fill="#8a8780"/></svg>`;

const SORTS = [
  { k:"views",  label:"Views: highest first", cmp:(a,b) => b.views - a.views },
  { k:"viewsLo",label:"Views: lowest first",  cmp:(a,b) => a.views - b.views },

  { k:"videos", label:"Videos: most first",    cmp:(a,b) => b.videos.length - a.videos.length || b.views - a.views },

  { k:"subs",    label:"Subscribers: most first",   cmp:(a,b) => b.subs - a.subs },

function filtered(){

function nodeChart(el, pts, o = {}){

    for (let y = d0.getUTCFullYear() + 1; y <= d1.getUTCFullYear(); y += step) { const xx = X(Date.UTC(y, 0, 1)); if (xx > W - m.r - 26) break; g += `<line class="gl" x1="${xx}" x2="${xx}" y1="${m.t}" y2="${H - m.b}"/><text x="${xx + 3}" y="${H - 6}">${y}</text>`; }
  } else {

    for (let k = 1; k <= months + 1; k += step) { const d = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + k, 1); if (d > t1) break; const xx = X(d);
      g += `<line class="gl" x1="${xx}" x2="${xx}" y1="${m.t}" y2="${H - m.b}"/><text x="${xx + 3}" y="${H - 6}">${new Date(d).toLocaleDateString("en", {month:"short", year:"2-digit", timeZone:"UTC"})}</text>`; }
  }
  pts.forEach(p => { p.cx = X(p.t); p.cy = Y(p.v); });
  const groups = {}; pts.forEach(p => (groups[p.series || "all"] ||= []).push(p));
  const line = Object.entries(groups).filter(([, ps]) => ps.length > 1).map(([k, ps]) => `<polyline class="pl pl-${k}" points="${ps.map(p => p.cx.toFixed(1) + "," + p.cy.toFixed(1)).join(" ")}"/>`).join("");
  const node = p => p.sq ? `<rect class="nd ${p.series || ""} ${p.cls || ""}" x="${(p.cx - (p.r || 4.5)).toFixed(1)}" y="${(p.cy - (p.r || 4.5)).toFixed(1)}" width="${2 * (p.r || 4.5)}" height="${2 * (p.r || 4.5)}" rx="1.5"/>`
    : `<circle class="nd ${p.series || ""} ${p.cls || ""}" cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="${p.r || 4.5}"/>`;
  const cur = pts.filter(p => p.cur);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.label || "Chart")}"><g class="ax">${g}</g>${line}
    ${pts.filter(p => !p.cur).map(node).join("")}${cur.map(p => `<circle class="cur-halo" cx="${p.cx}" cy="${p.cy}" r="12"/>` + node({ ...p, cls: p.series ? "cur-ring" : "cur", r: 6.5 })).join("")}
    <circle class="hl" r="10" visibility="hidden"/></svg><div class="ptip"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".ptip"), hl = el.querySelector(".hl");
  const near = ev => { const r = svg.getBoundingClientRect(), k = W / r.width, mx = (ev.clientX - r.left) * k, my = (ev.clientY - r.top) * k;
    let best = null, bd = 18 * 18; for (const p of pts) { const d = (p.cx - mx) ** 2 + (p.cy - my) ** 2; if (d < bd) { bd = d; best = p; } } return best; };
  svg.onmousemove = ev => {
    const p = near(ev);

function buildStory(x){

  const pattern = days <= 60 ? `All in one burst: every video within ${span(Math.max(days, 1))}`
    : comebacks ? `Came back to it ${comebacks === 1 ? "once" : comebacks === 2 ? "twice" : comebacks + " times"} after a break of 6+ months`

          <span><span class="t">${multi ? (n + 1) + ". " : ""}${esc(v.t)}</span><span class="m">${fullDate(v.d)} · ${fmt(v.v)} views</span><span class="m">${v.short ? "Short" : `${fmtDur(v.s)} · longer than ${pctLonger(C, v.s)}% of long-form`}</span></span></button>`).join("")}</div>
      </aside>
    </div>
    ${multi ? `<section class="sec panel">
      <div class="ph"><h4>Build history</h4><span class="legend"><span><i style="background:var(--s1)"></i>Long-form</span><span><i class="lg-sq" style="background:var(--s2)"></i>Short</span><span><i class="lg-ring"></i>Playing</span></span></div>
      <div class="stats">
        <div class="stat"><div class="k">Pattern</div><div class="v sm">${story.pattern}</div></div>
        <div class="stat"><div class="k">Span</div><div class="v">${span(Math.max(story.days, 1))}</div><div class="h">${fullDate(x.start)} → ${fullDate(x.last)}</div></div>
        <div class="stat"><div class="k">Average gap</div><div class="v">${span(story.avg)}</div><div class="h">longest gap ${span(story.longest)}</div></div>
        ${story.trend ? `<div class="stat"><div class="k">Interest</div>${story.trend.map(([d, l, t]) => `<div class="v sm trend"><span class="tm ${l === "Shorts" ? "short" : "long"}"></span><span><b>${l}</b> <span class="arr">${d === "up" ? "▲" : d === "down" ? "▼" : "▶"}</span> ${t}</span></div>`).join("")}</div>` : ""}
      </div>
      <div class="pchart" id="buildChart"></div>
      <p class="sub small">Each point is one video: when it came out and how many views it has today. Blue is long-form, green is Shorts, each with its own trend line. Shorts usually get far more views, so compare like with like. Newer videos have had less time to collect views.</p>
    </section>` : ""}
    ${x.links.length ? `<section class="sec"><h4>Articles, files &amp; more</h4><div class="lgrid">${x.links.map(l => {
      const host = new URL(l.url).hostname.replace(/^www\./, "");
      const ic = /youtu/.test(host) ? "▶" : /thangs|printables|etsy|cgtrader|do3d|onshape|tinyurl|github|kevinakasam/.test(host + l.label.toLowerCase()) ? "⬇" : "📰";
      return `<a class="lcard" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">${ic}</span><span><b>${esc(l.label)}</b><span>${esc(host)} ↗</span></span></a>`; }).join("")}</div></section>` : ""}
    <div style="height:60px"></div>
  </div>`;
  const play = (v, start) => {
    cur = v;
    if (!start) history.replaceState(null, "", `${link(x)}/${v.id}`);
    const p = $("player"); p.className = "player" + (v.short ? " short" : "");
    if (!start) p.innerHTML = embed(v, CAN_EMBED);
    const pb = p.querySelector("[data-play]"); if (pb) pb.onclick = () => { p.innerHTML = embed(v, true); };
    $("now").innerHTML = `<div><h3>${esc(v.t)}</h3><div class="m">${fullDate(v.d)} · ${v.v.toLocaleString()} views · <span class="tag len">${fmtDur(v.s)}</span>${v.short ? " Short" : ` longer than ${pctLonger(C, v.s)}% of long-form videos`}</div></div><a href="${yt(v.id)}" target="_blank" rel="noopener">Open on YouTube ↗</a>`;
    main.querySelectorAll(".vitem").forEach(o => {
      const on = o.dataset.v === v.id, th = o.querySelector(".th"), pl = th.querySelector(".playing");
      o.setAttribute("aria-current", on);
      if (on && !pl) th.insertAdjacentHTML("beforeend", `<span class="playing">▶ Playing</span>`);
      if (!on && pl) pl.remove();
    });
    if (multi) drawBuild();
  };
  const drawBuild = () => nodeChart($("buildChart"), x.videos.map((v, n) => ({
    t: ms(v.d), v: v.v, sq: v.short, series: v.short ? "short" : "long", cur: v === cur,
    tip: `<img src="${thumb(v.id)}" alt=""><b>${n + 1}. ${esc(v.t)}</b>${fullDate(v.d)} · ${fmt(v.v)} views · ${fmtDur(v.s)}${v.short ? " · Short" : ""}${n ? `<br><span class="mut">${span((ms(v.d) - ms(x.videos[n - 1].d)) / DAY)} after the previous video</span>` : ""}`,
    pick: v === cur ? null : () => { play(v); $("player").scrollIntoView({ behavior: "smooth", block: "center" }); }
  })), { H: window.innerWidth < 700 ? 170 : 210, label: `Videos in ${x.name} by date and views` });
  main.querySelectorAll(".vitem").forEach(b => b.onclick = () => play(x.videos.find(o => o.id === b.dataset.v)));
  play(cur, true);
  renderProject.redraw = () => multi && drawBuild();
}
document.addEventListener("keydown", e => {
  if (!current || e.target.closest("input,textarea,select,[role=listbox]") || e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
  if (e.key === "ArrowRight") $("pNext")?.click();
  if (e.key === "ArrowLeft") $("pPrev")?.click();
});

// ---------- routing: #/  ·  #/maker  ·  #/maker/project[/video] ----------
function update(){ renderControls(); renderPath(); if (!current) updateHome(); }
let page = null;
function route(){
  const [, a, b, c] = location.hash.split("/");
  const maker = a && CREATORS.find(k => k.slug === a);
  if (a && !maker) {  // links from before there were several makers: #/project[/video] were all Emily's
    const em = CREATORS.find(k => k.slug === "emily-the-engineer"), x = em && em.inventions.find(p => p.slug === a);
    location.replace(x ? `#/${em.slug}/${x.slug}${b ? "/" + b : ""}` : "#/"); return;
  }
  const prev = page;
  if (page === "maker") gridScroll = window.scrollY;
  if (!maker) {
    page = "makers"; current = null; C = null;
    document.body.className = "makers-page"; renderHeader(); renderControls(); renderPath(); renderMakers(); window.scrollTo(0, 0); return;
  }
  const switched = C !== maker; setCreator(maker);
  const x = b && I.find(p => p.slug === b);
  if (x) {
    page = "project"; current = x; markSeen(x); document.body.className = "proj";
    if (!filtered().includes(x)) { st.kind = "All"; st.q = ""; $("q").value = ""; saveSt(); }
    renderHeader(); renderControls(); renderPath(); renderProject(c); window.scrollTo(0, 0);
  } else {
    if (b) { location.replace(home()); return; }
    page = "maker"; current = null; document.body.className = "";
    renderHeader(); renderControls(); renderPath(); renderHome();
    window.scrollTo(0, prev === "project" && !switched ? gridScroll : 0);
  }
}
let rzT, lastW = window.innerWidth;
window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => {
  if (window.innerWidth === lastW) return; lastW = window.innerWidth;
  if (page === "makers") { drawHero(); renderMakers(); }
  else if (current) { renderPath(); renderProject.redraw?.(); } else { drawBars(cadence()); drawLengths(); updateHome(); }
}, 150); });
$("q").value = st.q;
window.addEventListener("hashchange", route);
// "All makers" and the logo go back to the front page with a fresh, empty search (even when already there).
document.addEventListener("click", e => {
  if (!e.target.closest('a[href="#/"]')) return;
  clearTimeout(qTimer); $("q").value = ""; st.q = ""; st.mq = ""; saveSt();
  if (page === "makers") renderMakerGrid();
});
$("qform").addEventListener("submit", ev => { ev.preventDefault(); applySearch(); $("q").blur();
  const target = $("makerGrid") || $("main"); const top = target.getBoundingClientRect().top + window.scrollY - topbar.offsetHeight - 12;
  if (top > window.scrollY) window.scrollTo({ top, behavior: "smooth" }); });
// Browsers that restore the page from memory (Back button, reopened tab) get a fresh slideshow too.
window.addEventListener("pageshow", ev => { if (!ev.persisted) return;
  if ($("q").value) { $("q").value = ""; applySearch(); }  // the Back button restores the old page from memory: start with an empty search here too
  if (page === "makers") drawHero(true); });
// The bar under the search only gets its dividing line once it is stuck to the top of the screen.
const topbar = document.querySelector(".topbar");
const markStuck = () => topbar.classList.toggle("stuck", topbar.getBoundingClientRect().top <= 0 && window.scrollY > 0);
window.addEventListener("scroll", markStuck, { passive: true });
// Back-to-top button: appears once the page has scrolled more than a screen and a half.
const toTop = $("toTop");
const markTop = () => { const show = window.scrollY > window.innerHeight * 1.5; if (toTop.hidden === show) toTop.hidden = !show; };
window.addEventListener("scroll", markTop, { passive: true });
toTop.onclick = () => window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
route();
</script>
