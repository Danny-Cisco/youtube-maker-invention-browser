<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Emily's Inventions</title>
<meta name="description" content="Every invention by Emily The Engineer, with a short description and all the videos, articles and files for each one.">
<style>
:root{color-scheme:light;--bg:#f6f5f2;--card:#fff;--line:#e2e0d8;--text:#111;--text2:#55534e;--muted:#85837b;--accent:#d9480f;--chip:#efede7;--s1:#2a78d6;--s2:#1baf7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111110;--card:#1b1b1a;--line:#2f2e2b;--text:#f1f0ec;--text2:#c4c2b9;--muted:#8d8b83;--accent:#ff7a3d;--chip:#262624;--s1:#3987e5;--s2:#199e70}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--card:#1b1b1a;--line:#2f2e2b;--text:#f1f0ec;--text2:#c4c2b9;--muted:#8d8b83;--accent:#ff7a3d;--chip:#262624;--s1:#3987e5;--s2:#199e70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
button,select,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
header{padding-top:40px;padding-bottom:18px}
header h1 a{text-decoration:none}
body.proj header{padding-top:16px;padding-bottom:6px}
body.proj header h1{font-size:28px;margin:2px 0 4px}
body.proj header .lead{display:none}
body.proj header .facts{margin-top:4px}
.path{padding-bottom:10px}
.path[hidden]{display:none}
.phead{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text2);margin-bottom:8px}
.phead b{color:var(--text)}
.phead .grow{flex:1;min-width:0}
.arrow{flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:30px;cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.arrow:hover:not(:disabled){border-color:var(--text2)}
.arrow:disabled{opacity:.35;cursor:default}
.gridlink{font-size:13px;color:var(--text2);white-space:nowrap}
.path{position:relative}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg-cur{background:var(--accent)}
.lg-seen{background:var(--text2)}
.pchart{position:relative}
.pchart svg{display:block;width:100%;overflow:visible}
.pchart .ax text{fill:var(--muted);font-size:10px}
.pchart .gl{stroke:var(--line);stroke-width:1}
.pchart .pl{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-opacity:.45;stroke-linejoin:round}
.pchart .nd{fill:var(--card);stroke:var(--text2);stroke-width:1.5}
.pchart .nd.seen{fill:var(--text2)}
.pchart .nd.long{fill:var(--s1);stroke:var(--card);stroke-width:1.5}
.pchart .nd.short{fill:var(--s2);stroke:var(--card);stroke-width:1.5}
.pchart .pl-long{stroke:var(--s1);stroke-opacity:.55;stroke-width:2}
.pchart .pl-short{stroke:var(--s2);stroke-opacity:.55;stroke-width:2}
.pchart .nd.cur-ring{stroke:var(--accent);stroke-width:3}
.lg-ring{border:2.5px solid var(--accent);background:var(--card)}
.pchart .nd.out{opacity:.2}
.pchart .cur{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.pchart .cur-halo{fill:var(--accent);opacity:.18}
.pchart .hl{fill:none;stroke:var(--text);stroke-width:1.5}
.ptip{position:absolute;pointer-events:none;display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:260px;z-index:30;color:var(--text2)}
.ptip b{display:block;color:var(--text);font-size:13px;line-height:1.3}
.ptip img{display:block;width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;margin-bottom:6px;background:var(--chip)}
.ptip .mut{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph h3,.ph h4{margin:0}
.ph h3{font-size:18px}
.sub{color:var(--text2);font-size:14px;margin:4px 0 10px}
.sub.small{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 14px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.stat .v{font-size:22px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v.sm{font-size:15px;font-weight:600;line-height:1.35;margin-top:2px}
.stat .h{font-size:12px;color:var(--muted)}
.trend{display:flex;gap:7px;align-items:baseline;font-size:14px!important;font-weight:500!important}
.trend b{font-weight:700}
.trend .arr{color:var(--accent)}
.tm{flex:none;width:8px;height:8px;border-radius:50%;background:var(--s1);transform:translateY(-1px)}
.tm.short{border-radius:2px;background:var(--s2)}
.lg-open{border:1.5px solid var(--text2);background:var(--card)}
.lg-sq{border:1.5px solid var(--text2);background:var(--card);border-radius:2px!important}
.vbtns{display:inline-flex;gap:4px}
.arrow small{font-size:10px}
.bars{position:relative}
.bars svg{display:block;width:100%;overflow:visible}
.bars .ax text{fill:var(--muted);font-size:11px}
.bars .ax .yr-l{fill:var(--text2);font-weight:600}
.bars .ax .bl{fill:var(--text2);font-weight:600;font-size:10.5px}
.bars .gl{stroke:var(--line)}
.bars .hit{fill:transparent}
.bar-g.on .hit{fill:var(--chip);opacity:.6}
.ptip em{color:var(--accent);font-style:normal;font-weight:600}
@media (max-width:700px){.stat .v{font-size:19px}.panel{padding:14px}.topbar{position:static}.legend{display:none}.phead .grow{font-size:13px;line-height:1.35}}
h1{font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px}
.lead{color:var(--text2);max-width:640px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;color:var(--text2);font-size:14px}
.facts b{color:var(--text)}

/* toolbar */
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-top:12px;padding-bottom:12px}
.bar input[type=search]{flex:1 1 220px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sort{position:relative}
.sortbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.sortbtn:hover{border-color:var(--text2)}
.sortbtn span{color:var(--text2)}
.sortbtn b{font-weight:600}
.sortbtn i{width:7px;height:7px;border-right:2px solid var(--text2);border-bottom:2px solid var(--text2);transform:translateY(-2px) rotate(45deg);margin-left:6px}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:280px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;margin:0;list-style:none;z-index:20}
.menu[hidden]{display:none}
.menu:focus{outline:none}
.menu li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:15px}
.menu li:hover,.menu li.kb{background:var(--chip)}
.menu li[aria-selected="true"]{font-weight:600}
.menu li[aria-selected="true"]::after{content:"";width:12px;height:6px;border-left:2.5px solid var(--text);border-bottom:2.5px solid var(--text);transform:rotate(-45deg) translateY(-2px)}
.menu .sep{height:1px;background:var(--line);margin:4px 8px;padding:0;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text2)}
.chips button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}

/* grid of project cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:20px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.img{position:relative;aspect-ratio:16/9;background:var(--chip)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--card);padding:3px 3px 0}
.strip img{width:100%;min-width:0;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:var(--chip)}
.strip .more{aspect-ratio:16/9;border-radius:3px;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--text2)}
.rank{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.75);color:#fff;font-weight:700;font-size:13px;border-radius:8px;padding:1px 8px}
.body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
h2{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.01em}
.yr{color:var(--muted);font-size:14px;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tag{background:var(--chip);color:var(--text2);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.desc{margin:0;color:var(--text2);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.yearh{font-size:28px;letter-spacing:-.02em;margin:26px 0 -6px}
.empty{color:var(--text2);padding:40px 0;text-align:center}
.other{padding:6px 0 40px;color:var(--text2);font-size:14px}
.other summary{cursor:pointer;font-weight:600}
.other ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:13px}

/* project page */
.ptitle{font-size:clamp(28px,5vw,44px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 8px}
.pdesc{color:var(--text2);max-width:760px;margin:10px 0 0;font-size:17px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-top:22px;align-items:start}
.player{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.poster{position:relative;display:block;width:100%;height:100%;border:0;padding:0;margin:0;background:#000;cursor:pointer;text-decoration:none}
.poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.poster:hover img{opacity:1}
.play{position:absolute;left:50%;top:50%;width:72px;height:50px;transform:translate(-50%,-50%);background:#e62117;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.play::after{content:"";position:absolute;left:29px;top:15px;border-left:18px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.poster .ext{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.8);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.player iframe{width:100%;height:100%;border:0;display:block}
.player.short{aspect-ratio:auto;height:min(78vh,720px);display:flex;justify-content:center}
.player.short iframe{aspect-ratio:9/16;width:auto;height:100%}
.now{margin-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.now h3{margin:0;font-size:18px;line-height:1.3}
.now .m{color:var(--muted);font-size:14px}
.now a{font-size:14px;color:var(--text2)}
.side h4,.sec h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:0 0 10px}
.vlist{display:flex;flex-direction:column;gap:8px;max-height:min(70vh,640px);overflow:auto;padding-right:4px}
.vitem{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:5px;cursor:pointer}
.vitem:hover{background:var(--card);border-color:var(--line)}
.vitem[aria-current="true"]{background:var(--card);border-color:var(--accent)}
.vitem .th{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--chip)}
.vitem img{width:100%;height:100%;object-fit:cover;display:block}
.vitem .badge{position:absolute;right:4px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:0 6px 0 5px;border-radius:4px;display:inline-flex;align-items:center;gap:4px}
.vitem .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--s1)}
.vitem .is-short .badge::before{border-radius:1.5px;background:var(--s2)}
.vitem .th::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--s1)}
.vitem .th.is-short::after{background:var(--s2)}
.vitem .playing{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:600}
.vitem .t,.vitem .m{display:block}
.vitem .t{font-size:14px;line-height:1.3;font-weight:600}
.vitem .m{font-size:12px;color:var(--muted);margin-top:2px}
.sec{margin-top:30px}
.sec.panel h4{margin:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none}
.lcard:hover{border-color:var(--accent)}
.lcard .ic{width:34px;height:34px;flex:none;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:16px;color:var(--accent)}
.lcard b{display:block;color:var(--text);font-size:14px;line-height:1.3}
.lcard span{font-size:12px;color:var(--muted)}
@media (max-width:860px){.layout{grid-template-columns:1fr}.vlist{max-height:none}}
@media (max-width:420px){.grid{grid-template-columns:1fr}.vitem{grid-template-columns:112px 1fr}}
</style>
</head>
<body>
<header class="wrap" id="hdr"></header>
<div class="topbar">
  <div class="bar wrap">
    <input type="search" id="q" placeholder="Search inventions" aria-label="Search inventions">
    <div class="sort">
      <button class="sortbtn" id="sortBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="sortMenu"><span>Sort:</span> <b id="sortName"></b><i aria-hidden="true"></i></button>
      <ul class="menu" id="sortMenu" role="listbox" aria-label="Sort inventions" tabindex="-1" hidden></ul>
    </div>
    <div class="chips" role="group" aria-label="Filter by type" id="chips"></div>
  </div>
  <nav class="path wrap" id="path" aria-label="Move between inventions" hidden></nav>
</div>
<main id="main"></main>
<script>
const DATA = /*DATA*/null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => new Intl.NumberFormat("en", {notation:"compact", maximumFractionDigits:1}).format(n);
const date = d => new Date(d + "T00:00:00").toLocaleDateString("en", {year:"numeric", month:"short"});
const fullDate = d => new Date(d + "T00:00:00").toLocaleDateString("en", {year:"numeric", month:"short", day:"numeric"});
const thumb = (id, q = "mqdefault") => `https://i.ytimg.com/vi/${id}/${q}.jpg`;
const yt = id => "https://www.youtube.com/watch?v=" + id;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const DAY = 864e5, ms = d => Date.parse(d + "T00:00:00Z");
const median = a => { const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length ? (s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2) : 0; };
const span = days => days < 14 ? plural(Math.round(days), "day") : days < 60 ? plural(Math.round(days / 7), "week") : days < 548 ? plural(Math.round(days / 30.4), "month") : (days / 365.25).toFixed(1) + " years";
const C = DATA.creator, I = DATA.inventions;
[...I].sort((a, b) => b.views - a.views).forEach((x, i) => x.popRank = i + 1);
I.forEach(x => { x.slug = slug(x.name); x.last = x.videos[x.videos.length - 1].d; x.sources = x.videos.length + x.links.length; });
const KINDS = ["All", ...new Set(I.map(x => x.kind))];

// Grid sort options, grouped "Field: direction". Chronology lives on the timeline chart instead.
const SORTS = [
  { k:"views",  label:"Views: highest first", cmp:(a,b) => b.views - a.views },
  { k:"viewsLo",label:"Views: lowest first",  cmp:(a,b) => a.views - b.views },
  { sep:true },
  { k:"videos", label:"Videos: most first",   cmp:(a,b) => b.videos.length - a.videos.length || b.views - a.views },
  { k:"links",  label:"Coverage: most first", cmp:(a,b) => b.sources - a.sources || b.views - a.views }
];
const SORT = Object.fromEntries(SORTS.filter(o => !o.sep).map(o => [o.k, o]));
const st = { sort:"views", kind:"All", q:"" };
try { Object.assign(st, JSON.parse(sessionStorage.getItem("ma.list") || "{}")); } catch {}
if (!SORT[st.sort]) st.sort = "views";
const saveSt = () => { try { sessionStorage.setItem("ma.list", JSON.stringify(st)); } catch {} };
function getSeen(){ try { return new Set(JSON.parse(localStorage.getItem("ma.seen") || "[]")); } catch { return new Set(); } }
function markSeen(x){ const s = getSeen(); s.add(x.slug); try { localStorage.setItem("ma.seen", JSON.stringify([...s])); } catch {} }

const $ = id => document.getElementById(id);
const main = $("main");
let current = null, gridScroll = 0;

function filtered(){
  const t = st.q.trim().toLowerCase();
  return I.filter(x => (st.kind === "All" || x.kind === st.kind) &&
    (!t || (x.name + " " + x.desc + " " + x.videos.map(v => v.t).join(" ")).toLowerCase().includes(t)));
}
const ordered = () => filtered().sort(SORT[st.sort].cmp);
const chrono = () => filtered().sort((a, b) => a.start.localeCompare(b.start) || a.name.localeCompare(b.name));
const byViews = () => filtered().sort((a, b) => b.views - a.views);

// ---------- reusable node chart: x = date, y = views (log) ----------
// pts: [{t, v, cls, tip, pick, sq}] in date order. Draws a line through them, nodes, hover tooltip, click.
function nodeChart(el, pts, o = {}){
  const W = el.clientWidth || 900, H = o.H || 140, m = { l: 40, r: 12, t: 14, b: 22 };
  if (!pts.length) { el.innerHTML = ""; return; }
  let t0 = Math.min(...pts.map(p => p.t)), t1 = Math.max(...pts.map(p => p.t));
  const padT = Math.max((t1 - t0) * 0.02, 20 * DAY); t0 -= padT; t1 += padT;
  const vs = pts.map(p => Math.max(1, p.v));
  let lo = Math.floor(Math.log10(Math.min(...vs))), hi = Math.ceil(Math.log10(Math.max(...vs)));
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const Y = v => H - m.b - (Math.log10(Math.max(1, v)) - lo) / (hi - lo) * (H - m.t - m.b);
  let g = "";
  for (let e = lo; e <= hi; e++) g += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${Y(10 ** e)}" y2="${Y(10 ** e)}"/><text x="${m.l - 6}" y="${Y(10 ** e) + 3.5}" text-anchor="end">${fmt(10 ** e)}</text>`;
  const yrs = (t1 - t0) / DAY / 365.25, d0 = new Date(t0), d1 = new Date(t1);
  if (yrs > 1.5) {
    const step = Math.max(1, Math.ceil(yrs / Math.max(2, Math.floor((W - 60) / 60))));
    for (let y = d0.getUTCFullYear() + 1; y <= d1.getUTCFullYear(); y += step) { const xx = X(Date.UTC(y, 0, 1)); g += `<line class="gl" x1="${xx}" x2="${xx}" y1="${m.t}" y2="${H - m.b}"/><text x="${xx + 3}" y="${H - 6}">${y}</text>`; }
  } else {
    const months = Math.round(yrs * 12), step = Math.max(1, Math.ceil(months / Math.max(2, Math.floor((W - 60) / 70))));
    for (let k = 1; k <= months + 1; k += step) { const d = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + k, 1); if (d > t1) break; const xx = X(d);
      g += `<line class="gl" x1="${xx}" x2="${xx}" y1="${m.t}" y2="${H - m.b}"/><text x="${xx + 3}" y="${H - 6}">${new Date(d).toLocaleDateString("en", {month:"short", year:"2-digit", timeZone:"UTC"})}</text>`; }
  }
  pts.forEach(p => { p.cx = X(p.t); p.cy = Y(p.v); });
  const groups = {}; pts.forEach(p => (groups[p.series || "all"] ||= []).push(p));
  const line = Object.entries(groups).filter(([, ps]) => ps.length > 1).map(([k, ps]) => `<polyline class="pl pl-${k}" points="${ps.map(p => p.cx.toFixed(1) + "," + p.cy.toFixed(1)).join(" ")}"/>`).join("");
  const node = p => p.sq ? `<rect class="nd ${p.series || ""} ${p.cls || ""}" x="${(p.cx - (p.r || 4.5)).toFixed(1)}" y="${(p.cy - (p.r || 4.5)).toFixed(1)}" width="${2 * (p.r || 4.5)}" height="${2 * (p.r || 4.5)}" rx="1.5"/>`
    : `<circle class="nd ${p.series || ""} ${p.cls || ""}" cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="${p.r || 4.5}"/>`;
  const cur = pts.filter(p => p.cur);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.label || "Chart")}"><g class="ax">${g}</g>${line}
    ${pts.filter(p => !p.cur).map(node).join("")}${cur.map(p => `<circle class="cur-halo" cx="${p.cx}" cy="${p.cy}" r="12"/>` + node({ ...p, cls: p.series ? "cur-ring" : "cur", r: 6.5 })).join("")}
    <circle class="hl" r="10" visibility="hidden"/></svg><div class="ptip"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".ptip"), hl = el.querySelector(".hl");
  const near = ev => { const r = svg.getBoundingClientRect(), k = W / r.width, mx = (ev.clientX - r.left) * k, my = (ev.clientY - r.top) * k;
    let best = null, bd = 18 * 18; for (const p of pts) { const d = (p.cx - mx) ** 2 + (p.cy - my) ** 2; if (d < bd) { bd = d; best = p; } } return best; };
  svg.onmousemove = ev => {
    const p = near(ev);
    if (!p) { tip.style.display = "none"; hl.setAttribute("visibility", "hidden"); svg.style.cursor = ""; return; }
    svg.style.cursor = p.pick ? "pointer" : ""; hl.setAttribute("cx", p.cx); hl.setAttribute("cy", p.cy); hl.setAttribute("visibility", "visible");
    tip.innerHTML = p.tip; tip.style.display = "block";
    const r = svg.getBoundingClientRect(), px = p.cx * r.width / W, py = p.cy * r.width / W;
    tip.style.left = Math.max(0, Math.min(px - tip.offsetWidth / 2, r.width - tip.offsetWidth)) + "px";
    tip.style.top = (py > tip.offsetHeight + 16 ? py - tip.offsetHeight - 14 : py + 16) + "px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; hl.setAttribute("visibility", "hidden"); };
  svg.onclick = ev => { const p = near(ev); if (p && p.pick) p.pick(); };
}

function cadence(){
  const U = DATA.uploads, long = U.filter(u => !u.short), shorts = U.length - long.length;
  const gaps = long.slice(1).map((u, i) => ({ d: (ms(u.d) - ms(long[i].d)) / DAY, from: long[i].d, to: u.d }));
  const longest = gaps.reduce((a, b) => b.d > a.d ? b : a, { d: 0 });
  const lastD = ms(U[U.length - 1].d), yearAgo = lastD - 365 * DAY;
  const recentLong = long.filter(u => ms(u.d) > yearAgo).length;
  const recentGaps = gaps.filter(g => ms(g.to) > yearAgo).map(g => g.d);
  const years = {}; U.forEach(u => { const y = u.d.slice(0, 4); (years[y] ||= { long: 0, short: 0 })[u.short ? "short" : "long"]++; });
  const invYears = {}; I.forEach(x => { const y = x.start.slice(0, 4); invYears[y] = (invYears[y] || 0) + 1; });
  return { U, long, shorts, gaps, longest, recentLong, recentMedian: median(recentGaps), median: median(gaps.map(g => g.d)), mean: gaps.reduce((s, g) => s + g.d, 0) / gaps.length, years, invYears };
}

function embed(v, autoplay){

function buildStory(x){
  const vs = x.videos, days = (ms(x.last) - ms(x.start)) / DAY;
  const gaps = vs.slice(1).map((v, i) => (ms(v.d) - ms(vs[i].d)) / DAY);
  const comebacks = gaps.filter(g => g >= 180).length;
  const pattern = days <= 60 ? `All in one burst: every video within ${span(Math.max(days, 1))}`
    : comebacks ? `Came back to it ${comebacks === 1 ? "once" : comebacks === 2 ? "twice" : comebacks + " times"} after a break of 6+ months`
    : `Steady run over ${span(days)}`;
  // Compare like with like: a separate trend for long-form videos and for Shorts (each needs 2+ videos).
  const trendOf = (vids, label) => {
    if (vids.length < 2) return null;
    const ys = vids.map(v => Math.log10(Math.max(1, v.v))), n = ys.length, mx = (n - 1) / 2, my = ys.reduce((a, b) => a + b, 0) / n;
    const slope = ys.reduce((s, y, i) => s + (i - mx) * (y - my), 0) / ys.reduce((s, _, i) => s + (i - mx) ** 2, 0);
    const ratio = vids[n - 1].v / vids[0].v;
    return slope > 0.08 ? ["up", label, `grew: latest has ${fmt(ratio)}× the first's views`]
         : slope < -0.08 ? ["down", label, `faded: latest has ${Math.max(1, Math.round(ratio * 100))}% of the first's views`]
         : ["flat", label, "held steady"];
  };
  const trends = [trendOf(vs.filter(v => !v.short), "Long-form"), trendOf(vs.filter(v => v.short), "Shorts")].filter(Boolean);
  const trend = trends.length ? trends : null;
  return { days, gaps, pattern, trend, avg: gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 0, longest: gaps.length ? Math.max(...gaps) : 0 };
}

      const host = new URL(l.url).hostname.replace(/^www\./, "");
      const ic = /youtu/.test(host) ? "▶" : /thangs|printables|etsy|cgtrader|do3d|onshape|tinyurl|github|kevinakasam/.test(host + l.label.toLowerCase()) ? "⬇" : "📰";
      return `<a class="lcard" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">${ic}</span><span><b>${esc(l.label)}</b><span>${esc(host)} ↗</span></span></a>`; }).join("")}</div></section>` : ""}
    <div style="height:60px"></div>
  </div>`;
  const play = (v, start) => {
    cur = v;
    if (!start) history.replaceState(null, "", `#/${x.slug}/${v.id}`);
    const p = $("player"); p.className = "player" + (v.short ? " short" : "");
    if (!start) p.innerHTML = embed(v, CAN_EMBED);
    const pb = p.querySelector("[data-play]"); if (pb) pb.onclick = () => { p.innerHTML = embed(v, true); };
    $("now").innerHTML = `<div><h3>${esc(v.t)}</h3><div class="m">${fullDate(v.d)} · ${v.v.toLocaleString()} views</div></div><a href="${yt(v.id)}" target="_blank" rel="noopener">Open on YouTube ↗</a>`;
    main.querySelectorAll(".vitem").forEach(o => {
      const on = o.dataset.v === v.id, th = o.querySelector(".th"), pl = th.querySelector(".playing");
      o.setAttribute("aria-current", on);
      if (on && !pl) th.insertAdjacentHTML("beforeend", `<span class="playing">▶ Playing</span>`);
      if (!on && pl) pl.remove();
    });
    if (multi) drawBuild();
  };
  const drawBuild = () => nodeChart($("buildChart"), x.videos.map((v, n) => ({
    t: ms(v.d), v: v.v, sq: v.short, series: v.short ? "short" : "long", cur: v === cur,
    tip: `<img src="${thumb(v.id)}" alt=""><b>${n + 1}. ${esc(v.t)}</b>${fullDate(v.d)} · ${fmt(v.v)} views${v.short ? " · Short" : ""}${n ? `<br><span class="mut">${span((ms(v.d) - ms(x.videos[n - 1].d)) / DAY)} after the previous video</span>` : ""}`,
    pick: v === cur ? null : () => { play(v); $("player").scrollIntoView({ behavior: "smooth", block: "center" }); }
  })), { H: window.innerWidth < 700 ? 170 : 210, label: `Videos in ${x.name} by date and views` });
  main.querySelectorAll(".vitem").forEach(b => b.onclick = () => play(x.videos.find(o => o.id === b.dataset.v)));
  play(cur, true);
  renderProject.redraw = () => multi && drawBuild();
}
document.addEventListener("keydown", e => {
  if (!current || e.target.closest("input,textarea,select,[role=listbox]") || e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
  if (e.key === "ArrowRight") $("pNext")?.click();
  if (e.key === "ArrowLeft") $("pPrev")?.click();
});

// ---------- routing ----------
function update(){ renderControls(); renderPath(); if (!current) updateHome(); }
function route(){
  const [, s, vid] = location.hash.split("/");
  const x = s && I.find(p => p.slug === s);
  const wasHome = !current;
  if (x) {
    if (wasHome) gridScroll = window.scrollY;
    current = x; markSeen(x); document.body.classList.add("proj");
    if (!filtered().includes(x)) { st.kind = "All"; st.q = ""; $("q").value = ""; saveSt(); }
    renderControls(); renderPath(); renderProject(vid); window.scrollTo(0, 0);
  } else {
    current = null; document.body.classList.remove("proj");
    renderControls(); renderPath(); renderHome(); if (!wasHome) window.scrollTo(0, gridScroll);
  }
}
let rzT, lastW = window.innerWidth;
window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => {
  if (window.innerWidth === lastW) return; lastW = window.innerWidth;
  if (current) { renderPath(); renderProject.redraw?.(); } else { drawBars(cadence()); updateHome(); }
}, 150); });
renderHeader();
$("q").value = st.q;
window.addEventListener("hashchange", route);
route();
</script>
